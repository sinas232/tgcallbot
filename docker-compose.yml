# ═══════════════════════════════════════════════════════════════════════
# استقرار «همیشه با WARP» — WARP به‌صورت ایزوله داخل داکر
# ═══════════════════════════════════════════════════════════════════════
# کل ترافیک اینترنتِ ربات (سیگنالینگ تلگرام + مدیای UDP/WebRTC ویس‌کال) از
# داخل کانتینر warp عبور می‌کند. شبکهٔ هاست و دسترسی SSH هرگز لمس نمی‌شود.
# با یک دستور ساده اجرا می‌شود و هیچ‌وقت بدون WARP بالا نمی‌آید:
#     docker compose up -d --build
#
# نکتهٔ DNS: وقتی warp تونل را بالا می‌آورد DNSِ داخلی داکر (127.0.0.11) را
# دور می‌زند؛ برای همین به db و redis IP ثابت می‌دهیم و نامشان را در
# /etc/hosts کانتینر warp ثبت می‌کنیم. چون bot در فضای شبکهٔ warp اجرا می‌شود
# همان /etc/hosts را می‌بیند و بدون DNS به دیتابیس/ردیس وصل می‌شود.
# ═══════════════════════════════════════════════════════════════════════
services:
  warp:
    image: caomingjun/warp:latest
    container_name: warp_container
    restart: always
    # این cgroup rule پس از تغییرات runc برای ساخت دستگاه TUN لازم است.
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
      # ── تونل کاملِ لایهٔ ۳ (TUN) — v2.3.8 ─────────────────────────────
      # بدون این متغیر، ایمیج فقط پروکسی SOCKS5:1080 می‌سازد و ترافیکِ
      # «غیر-پروکسی» کانتینرها مستقیم از IP هاست (ایرانی) خارج می‌شد؛ نتیجه:
      # سیگنالینگ MTProto آن هم فقط از طریق پروکسی می‌رفت ولی مدیا/UDPِ
      # WebRTC ویس‌کال (ntgcalls که پروکسی نمی‌فهمد) مستقیم و فیلترشده بیرون
      # می‌زد ← علت «ghost: media connection missing». با NAT-mode کلاینت
      # به حالت «warp» (اینترفیس CloudflareWARP + default route) می‌رود و کل
      # ترافیکِ فضای شبکهٔ مشترک — به‌ویژه UDP ویس‌کال — از تونل WARP عبور می‌کند.
      - WARP_ENABLE_NAT=1
      # برای WARP+ کلید را در .env بگذارید (اختیاری):
      # - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # لازم برای NAT mode (تونل لایهٔ ۳)؛ طبق سند رسمی warp-docker:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.accept_ra=2
    # نام db و redis را مستقیم به IP ثابتشان می‌بندیم تا مستقل از DNSِ
    # شکستهٔ warp کار کنند. bot از همین /etc/hosts استفاده می‌کند.
    extra_hosts:
      - "db:172.28.0.2"
      - "redis:172.28.0.3"
      - "payproxy:172.28.0.5"
    # پورت 8080 دیگر مستقیم منتشر نمی‌شود؛ چون bot در فضای شبکهٔ warp است،
    # انتشار مستقیم دچار مشکل مسیر برگشت (asymmetric routing) از تونل WARP
    # می‌شود و از اینترنت جواب نمی‌دهد. به‌جایش کانتینر nginx (خارج از WARP)
    # درخواست‌های ورودی را می‌گیرد و داخلی به 172.28.0.4:8080 پاس می‌دهد.
    # وب‌سرور همچنان داخل همین netns روی 8080 گوش می‌دهد و از شبکهٔ داخلی داکر
    # (توسط nginx) در دسترس است.
    expose:
      - "8080"
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    networks:
      default:
        ipv4_address: 172.28.0.4
    healthcheck:
      # هم warp=on از پروکسی SOCKS5، هم وجودِ اینترفیس TUN (CloudflareWARP)
      # چک می‌شود — تا «شبه‌شفافیت» رخ ندهد که پروکسی سالم است ولی تونل
      # لایهٔ ۳ بالا نیامده (همان باگی که مدیا/UDP ویس را direct می‌انداخت).
      test: ["CMD-SHELL", "test -d /sys/class/net/CloudflareWARP && curl -fs --socks5 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -q 'warp=on' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # اصلاح مسیر برگشت (asymmetric routing) برای ترافیک ورودیِ callback
  # ─────────────────────────────────────────────────────────────────────
  # WARP یک default route از طریق TUN می‌سازد، پس پاسخِ درخواست‌هایی که از
  # nginx (172.28.0.6) به وب‌سرور 8080 داخل netns warp می‌آیند، به‌جای برگشت
  # از اینترفیس eth0، از تونل WARP می‌رود و گم می‌شود (502/Connection refused).
  # این کانتینر کمکی در همان netns warp اجرا می‌شود و با یک «ip rule» ترافیکِ
  # مقصدـِ زیرشبکهٔ داکر را مجبور می‌کند از جدول مسیریابیِ main (نه TUN) برگردد.
  # یک‌بار اجرا می‌شود، سپس زنده می‌ماند؛ warp را ری‌استارت نمی‌کند (پایدار).
  routefix:
    image: alpine:3.19
    container_name: warp_routefix_container
    restart: always
    network_mode: "service:warp"
    cap_add:
      - NET_ADMIN
    depends_on:
      warp:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache iproute2 >/dev/null 2>&1 || true
        # ترافیک با مقصدِ زیرشبکهٔ داکر باید از جدول main مسیر بگیرد نه TUN.
        # priority پایین‌تر از قانون TUNِ warp تا زودتر ارزیابی شود.
        ip rule add to 172.28.0.0/16 lookup main priority 100 2>/dev/null || true
        echo "[routefix] ip rule for 172.28.0.0/16 -> main installed"
        ip rule show || true
        # زنده ماندن تا کانتینر بالا بماند (بدون مصرف CPU).
        while true; do sleep 3600; done

  bot:
    build: .
    container_name: telegram_bot_container
    restart: always
    # python با exec جایگزین sh می‌شود (PID 1) تا SIGTERM را بگیرد؛
    # خاموش شدن تمیز ده‌ها کلاینت ویس چند ثانیه طول می‌کشد، پس مهلت
    # توقف را از ۱۰ ثانیهٔ پیش‌فرض بیشتر می‌کنیم تا SIGKILL نخورد.
    init: true
    stop_grace_period: 90s
    # ربات فضای شبکهٔ سرویس warp را به اشتراک می‌گذارد ⇒ کل ترافیکش از WARP رد می‌شود.
    # (به همین دلیل bot خودش ports/networks/extra_hosts ندارد؛ همه از warp می‌آید.)
    network_mode: "service:warp"
    # هر اتصال WebRTC ده‌ها socket/FD باز می‌کند؛ با ده‌ها اکانت همزمان
    # سقف پیش‌فرض (~1024) زود تمام می‌شود و اتصالات جدید Drop می‌شوند.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # ── محدودیت سخت‌افزاری (فضای تنفس برای هاست) ─────────────────────────
    # سقف CPU/RAM کانتینر ربات؛ با `docker compose up` (پلاگین v2) اعمال می‌شود.
    # سقف ۲ هستهٔ ملایم انتخاب شده تا اسپایک لحظه‌ای ورودِ ۳۷ اکانت خفه نشود،
    # ولی مصرف در حالت پایدار (با uvloop + تک‌ریسمانی ffmpeg + لاگ خفه‌شده)
    # به‌راحتی زیر این سقف می‌ماند. برای سخت‌گیری بیشتر cpus را روی '1.0' بگذارید.
    # Compose applies these to both non-Swarm and Swarm resource settings.
    # Verify the EFFECTIVE limits after deploy with docker inspect; a value
    # in .env alone is not proof that a container was recreated with it.
    deploy:
      resources:
        limits:
          cpus: "${BOT_CPU_LIMIT:-2.0}"
          memory: ${BOT_MEM_LIMIT:-1536M}
    mem_limit: ${BOT_MEM_LIMIT:-1536M}
    cpus: ${BOT_CPU_LIMIT:-2.0}
    environment:
      # هماهنگ با TZ داخل Dockerfile؛ زمان تهران برای ربات
      - TZ=${TZ:-Asia/Tehran}
      # کلاینت‌های ویس از پروکسی SOCKS5 کانتینر warp رد می‌شوند. چون bot با
      # network_mode: service:warp اجرا می‌شود، پروکسی warp روی 127.0.0.1:1080
      # در دسترس است (نه با نام کانتینر، که در namespace مشترک resolve نمی‌شود).
      # مقادیر .env در صورت وجود این‌ها را override می‌کنند.
      - USE_PROXY=${USE_PROXY:-true}
      - SOCKS5_HOST=${SOCKS5_HOST:-127.0.0.1}
      - SOCKS5_PORT=${SOCKS5_PORT:-1080}
      # پروکسی درخواست‌های درگاه پرداخت (بدون WARP، از IP ایرانی هاست).
      # اگر خالی شود، درخواست‌های پرداخت مستقیم (از WARP) می‌روند.
      - PAYMENT_HTTP_PROXY=${PAYMENT_HTTP_PROXY:-http://payproxy:8888}
    depends_on:
      warp:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      payproxy:
        condition: service_started
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      # همگام‌سازی زمان کانتینر با هاست برای جلوگیری از خطای تلگرام
      - /etc/localtime:/etc/localtime:ro

  db:
    image: postgres:15-alpine
    container_name: postgres_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host-side maintenance only. Never publish the account/session DB on
    # 0.0.0.0:5432: Docker-published ports can bypass host UFW rules.
    # Containers still connect to db:5432 over the private Compose network.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      default:
        ipv4_address: 172.28.0.2
    healthcheck:
      # افزودن -d تا pg_isready سراغ دیتابیسِ واقعی برود و لاگِ
      # «FATAL: database "<user>" does not exist» هر ۵ ثانیه چاپ نشود.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegram_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      default:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # پروکسی درگاه پرداخت (بدون WARP)
  # ─────────────────────────────────────────────────────────────────────
  # درگاه‌های پرداخت ایرانی (زرین‌پال/آقای پرداخت) اتصال از IP خارجیِ WARP را
  # نمی‌پذیرند. چون ربات با network_mode: service:warp اجرا می‌شود، کل ترافیکش
  # (از جمله ساخت لینک پرداخت) از IP خارجی می‌رود و timeout می‌خورد.
  # این کانتینر روی شبکهٔ عادیِ داکر است، پس ترافیکش از IP ایرانیِ هاست خارج
  # می‌شود. ربات فقط درخواست‌های پرداخت را از این پروکسی رد می‌کند
  # (PAYMENT_HTTP_PROXY=http://172.28.0.5:8888)، و تماس‌های صوتی همچنان WARP.
  payproxy:
    build: ./proxy
    container_name: payment_proxy_container
    restart: always
    networks:
      default:
        ipv4_address: 172.28.0.5
    healthcheck:
      # صرفاً بررسی می‌کند پروسهٔ tinyproxy در حال اجراست (چون bot با
      # service_started به آن وابسته است، این چک فقط برای نمایش در docker ps است).
      test: ["CMD-SHELL", "pgrep tinyproxy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # nginx — reverse proxy برای وب‌سرور callback (خارج از WARP)
  # ─────────────────────────────────────────────────────────────────────
  # چون bot با network_mode: service:warp اجرا می‌شود، انتشار مستقیم پورت 8080
  # دچار مشکل مسیر برگشت (asymmetric routing) از تونل WARP می‌شود و از اینترنت
  # جواب نمی‌دهد. این nginx در شبکهٔ عادیِ داکر است (نه WARP)، پس پاسخش از مسیر
  # درستِ هاست به کاربر برمی‌گردد. پورت 80 عمومی را می‌گیرد و داخلی به
  # 172.28.0.4:8080 (وب‌سرور داخل netns warp) پاس می‌دهد.
  webproxy:
    image: nginx:1.27-alpine
    container_name: web_proxy_container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        ipv4_address: 172.28.0.6
    depends_on:
      warp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  warp_data:
