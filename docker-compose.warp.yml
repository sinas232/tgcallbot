# ═══════════════════════════════════════════════════════════════════════
# اجرای ربات با Cloudflare WARP به‌صورت «ایزوله در داکر» (روش امن و توصیه‌شده)
# ═══════════════════════════════════════════════════════════════════════
# چرا این روش؟
#   WARP فقط داخل کانتینر خودش (سرویس warp) اجرا می‌شود و کل ترافیک اینترنتِ
#   ربات (شامل سیگنالینگ تلگرام و مدیای UDP/WebRTC ویس‌کال) از داخل آن عبور
#   می‌کند. سیستم‌عاملِ سرور، جدول مسیریابی هاست و مهم‌تر از همه دسترسی SSH
#   شما هرگز دستکاری نمی‌شود. (هرگز روی خود هاست `warp-cli connect` نزنید.)
#
# نحوهٔ اجرا (کنار docker-compose.yml اصلی):
#   docker compose -f docker-compose.yml -f docker-compose.warp.yml up -d --build
#
# توقف:
#   docker compose -f docker-compose.yml -f docker-compose.warp.yml down
#
# ⚠️ نکتهٔ مهم دربارهٔ DNS:
#   وقتی کانتینر warp تونل را بالا می‌آورد، DNS داخلی داکر (127.0.0.11) را
#   دور می‌زند؛ در نتیجه نام‌های سرویسی مثل db و redis دیگر resolve نمی‌شوند
#   (خطای «Name or service not known»). برای رفع قطعی، به db و redis IP ثابت
#   می‌دهیم و همان‌ها را در /etc/hosts کانتینر warp ثبت می‌کنیم. چون bot در
#   فضای شبکهٔ warp اجرا می‌شود، از همین /etc/hosts استفاده می‌کند و اتصال به
#   دیتابیس/ردیس مستقل از DNS برقرار می‌ماند. پس در .env مقادیر را روی
#   db / redis نگه دارید (نیازی به تغییر نیست).
#
#   همچنین پورت 8080 (کال‌بک پرداخت) روی سرویس warp منتشر می‌شود، چون bot
#   پورت شبکهٔ مستقل ندارد و در namespace شبکهٔ warp زندگی می‌کند.
# ═══════════════════════════════════════════════════════════════════════
services:
  warp:
    image: caomingjun/warp:latest
    container_name: warp_container
    restart: always
    # این cgroup rule پس از تغییرات runc برای ساخت دستگاه TUN لازم است.
    device_cgroup_rules:
      - 'c 10:200 rwm'
    environment:
      - WARP_SLEEP=2
      # برای WARP+ کلید را اینجا بگذارید (اختیاری):
      # - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    # نام db و redis را مستقیم به IP ثابتشان می‌بندیم تا مستقل از DNSِ
    # شکستهٔ warp کار کنند. bot از همین /etc/hosts استفاده می‌کند.
    extra_hosts:
      - "db:172.28.0.2"
      - "redis:172.28.0.3"
    # پورت وب‌سرور ربات (کال‌بک پرداخت) از اینجا منتشر می‌شود، چون bot در
    # فضای شبکهٔ همین کانتینر اجرا می‌شود.
    ports:
      - "8080:8080"
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    networks:
      default:
        ipv4_address: 172.28.0.4
    healthcheck:
      # تا وقتی تونل WARP واقعاً برقرار نشده (warp=on)، ربات استارت نمی‌خورد.
      test: ["CMD-SHELL", "curl -fs --socks5 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -q 'warp=on' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  bot:
    # ربات فضای شبکهٔ سرویس warp را به اشتراک می‌گذارد ⇒ کل ترافیکش از WARP رد می‌شود.
    network_mode: "service:warp"
    # پورت‌های تعریف‌شده در فایل پایه اینجا باید ریست شوند (با network_mode مجاز نیستند).
    ports: !reset []
    depends_on:
      warp:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # IP ثابت برای db و redis تا در /etc/hosts کانتینر warp قابل ثبت باشند.
  db:
    networks:
      default:
        ipv4_address: 172.28.0.2

  redis:
    networks:
      default:
        ipv4_address: 172.28.0.3

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  warp_data:
