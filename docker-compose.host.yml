# ═══════════════════════════════════════════════════════════════════════
# فقط عیب‌یابیِ آگاهانه و پس از اتمام همهٔ سفارش‌ها؛ نه درمان UDP/WebRTC.
# ═══════════════════════════════════════════════════════════════════════
# حالت عادی، bot در netns تونل WARP است. این override ربات را به شبکهٔ HOST
# می‌برد و از WARP NAT دور می‌کند! حتی موفقیت UDP/53 دلیل سلامت مدیای تلگرام
# نیست. قبل از تغییر، سفارش‌های فعال باید تمام شوند و مسیر ترافیک جداگانه
# بررسی شود؛ اجرای این فایل وسط سفارش اکانت‌ها را قطع می‌کند.
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#
# ⚠️  در حالت host، پروکسی 127.0.0.1:1080 داخل warp در دسترس bot نیست.
#     مگر اینکه روی خود هاست SOCKS مطمئن داشته باشید، USE_PROXY=false لازم
#     است؛ اما ارتباطِ host خارج از WARP ممکن است فیلتر باشد. این فایل
#     راهکار دائمیِ رفع خروج اکانت نیست.
# ⚠️  در حالت host، نام‌های کانتینر (db / redis) دیگر resolve نمی‌شوند؛
#     قبل از اجرا این سه مقدار را در .env روی 127.0.0.1 بگذار:
#       POSTGRES_HOST=127.0.0.1
#       DATABASE_URL=postgresql://USER:PASS@127.0.0.1:5432/DB
#       REDIS_URL=redis://127.0.0.1:6379/0
#     (db پورت 5432 را از قبل expose می‌کند؛ redis را این override اضافه
#     می‌کند. برای برگشت: مقدارهای قبلی .env را برگردان و
#     docker compose up -d --build بدون override.)
services:
  bot:
    network_mode: "host"
    ports: !reset []
    extra_hosts:
      - "db:127.0.0.1"
      - "redis:127.0.0.1"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  redis:
    # Diagnostic host-network mode needs a host socket, not a PUBLIC Redis.
    ports:
      - "127.0.0.1:6379:6379"
