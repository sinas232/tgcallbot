# تنظیمات tinyproxy برای عبور درخواست‌های درگاه پرداخت (بدون WARP).
User tinyproxy
Group tinyproxy
Port 8888

# روی همهٔ اینترفیس‌های داخلیِ شبکهٔ داکر گوش می‌دهد.
Listen 0.0.0.0
Timeout 600

# فقط از شبکهٔ داخلی داکر اجازهٔ استفاده می‌دهیم (نه اینترنت عمومی).
Allow 172.28.0.0/16
Allow 127.0.0.1

# اتصال HTTPS (CONNECT) فقط به پورت 443 مجاز است — کافی برای APIهای پرداخت.
ConnectPort 443
ConnectPort 8443

# لاگ حداقلی
LogLevel Warning

MaxClients 50
StartServers 3
MinSpareServers 2
MaxSpareServers 8

DisableViaHeader Yes
