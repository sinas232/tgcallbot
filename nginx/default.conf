# Reverse proxy فقط برای مسیرهای پرداخت.
# پورت ۸۰ باید از اینترنت باز باشد چون درگاه (زرین‌پال / آقای‌پرداخت)
# کاربر را بعد از پرداخت به /payment/callback/... برمی‌گرداند و صفحهٔ
# /pay/{id} هم برای الزام شاپرک (Referrer روی دامنهٔ رسمی) لازم است.
#
# قبلاً location / همه‌چیز را به aiohttp ربات می‌فرستاد؛ اسکنرها و
# مرورگرهایی که GET / می‌زنند پاسخ ۲۰۰ می‌گرفتند، لاگ ربات را پر
# می‌کردند و ریسک abuse/اسکن روی سرور را بالا می‌بردند.
# حالا هر مسیری غیر از پرداخت اتصال را بدون پاسخ قطع می‌کند (444).

limit_req_zone $binary_remote_addr zone=pay:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;

    # هلث‌چک خود nginx — به ربات نمی‌رود (دیگر Wget هر ۳۰ ثانیه aiohttp را نمی‌زند)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /pay/ {
        limit_req zone=pay burst=20 nodelay;
        proxy_pass http://172.28.0.4:8080;
    }

    location /payment/ {
        limit_req zone=pay burst=20 nodelay;
        proxy_pass http://172.28.0.4:8080;
    }

    # اسکنر / رفرش مرورگر روی GET / و هر مسیر دیگر: قطع اتصال، بدون پاسخ، بدون لاگ
    location / {
        access_log off;
        return 444;
    }
}
