# Reverse proxy برای وب‌سرور callback درگاه پرداخت.
# چون کانتینر bot با network_mode: service:warp اجرا می‌شود، پورت 8080 که
# مستقیم منتشر شود دچار مشکل مسیر برگشت (asymmetric routing) از تونل WARP
# می‌شود و از اینترنت جواب نمی‌دهد. این nginx در فضای شبکهٔ عادیِ داکر است،
# پس پاسخش از مسیر درستِ هاست به کاربر برمی‌گردد. درخواست را به IP داخلیِ
# کانتینر warp (که وب‌سرور در همان netns روی 8080 گوش می‌دهد) پاس می‌دهد؛
# این ارتباط داخلیِ شبکهٔ داکر است و مشکل مسیر برگشت ندارد.

# محدودیت نرخ درخواست برای جلوگیری از بات‌ها و اسکنرهای اینترنت
limit_req_zone $binary_remote_addr zone=web_req_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=web_conn_limit:10m;

server {
    listen 80 default_server;
    server_name _;

    # سقف حجم بدنه (برای callbackها کافی است)
    client_max_body_size 2m;

    # پاسخ مستقیم و فوق‌سریع Nginx به درخواست‌های روت /
    # با این کار، اسکنرهای وب و کراولرهای اینترنت هرگز به سرور پایتون ربات نمی‌رسند
    # و لاگ‌های کانتینر با GET / اسپم نمی‌شوند.
    location = / {
        limit_req zone=web_req_limit burst=5 nodelay;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # مسیرهای پرداخت و کال‌بک درگاه‌ها
    location / {
        limit_req zone=web_req_limit burst=20 nodelay;
        limit_conn web_conn_limit 10;

        proxy_pass http://172.28.0.4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }
}
